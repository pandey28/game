<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Under Maintenance | Aashish Pandey</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --red: #e0101e;
        --bg: #08080a;
        --text: #f2f2f5;
        --muted: #c9c9d0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 70% 30%,
            rgba(224, 16, 30, 0.14),
            transparent 55%
          ),
          radial-gradient(
            ellipse at 10% 90%,
            rgba(224, 16, 30, 0.06),
            transparent 50%
          );
        pointer-events: none;
      }

      /* scene */
      .scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        z-index: 0;
      }
      .scene svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          var(--bg) 0%,
          rgba(8, 8, 10, 0.7) 30%,
          transparent 62%
        );
      }
      .moon {
        animation: pulse 6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          filter: brightness(1.18);
        }
      }
      .bat {
        animation: fly 9s ease-in-out infinite alternate;
      }
      .bat:nth-of-type(2) {
        animation-delay: -3s;
      }
      .bat:nth-of-type(3) {
        animation-delay: -6s;
      }
      @keyframes fly {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(-30px, -14px);
        }
      }
      .win {
        animation: flick 3s infinite alternate;
      }
      @keyframes flick {
        0% {
          opacity: 0.6;
        }
        100% {
          opacity: 1;
        }
      }

      /* layout */
      .wrap {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        padding: 48px 8vw;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 26px;
      }
      .brand {
        font-family: "Creepster", cursive;
        font-size: 2rem;
        font-weight: 400;
        letter-spacing: 2px;
        color: #ffd700;
        text-shadow:
          0 0 3px #ffd700,
          0 0 8px #ffae00,
          0 0 15px #ff8c00;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 560px;
        padding: 40px 0;
      }
      h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 700;
        line-height: 1.05;
        font-size: clamp(2.8rem, 7vw, 5.2rem);
        letter-spacing: 0.01em;
      }
      h1 span {
        display: block;
        color: var(--red);
      }
      h1 .u {
        display: block;
        font-weight: inherit;
        animation: flickerSoft 5s infinite;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.25);
      }
      h1 span {
        animation: flicker 4s infinite;
        text-shadow:
          0 0 14px rgba(224, 16, 30, 0.85),
          0 0 40px rgba(224, 16, 30, 0.55);
      }
      @keyframes flicker {
        0%,
        16%,
        23%,
        53%,
        61%,
        83%,
        87%,
        100% {
          opacity: 1;
          text-shadow:
            0 0 14px rgba(224, 16, 30, 0.85),
            0 0 40px rgba(224, 16, 30, 0.55);
        }
        17% {
          opacity: 0.12;
          text-shadow: none;
        }
        18% {
          opacity: 1;
        }
        19% {
          opacity: 0.25;
          text-shadow: none;
        }
        20% {
          opacity: 1;
        }
        21% {
          opacity: 0.05;
          text-shadow: none;
        }
        22% {
          opacity: 0.9;
        }
        54% {
          opacity: 0.2;
          text-shadow: none;
        }
        55% {
          opacity: 1;
        }
        56% {
          opacity: 0.08;
          text-shadow: none;
        }
        57% {
          opacity: 0.85;
        }
        58% {
          opacity: 0.2;
          text-shadow: none;
        }
        59% {
          opacity: 1;
        }
        60% {
          opacity: 0.15;
          text-shadow: none;
        }
        84% {
          opacity: 0.3;
          text-shadow: none;
        }
        85% {
          opacity: 1;
        }
        86% {
          opacity: 0.1;
          text-shadow: none;
        }
      }
      @keyframes flickerSoft {
        0%,
        30%,
        36%,
        70%,
        76%,
        100% {
          opacity: 1;
        }
        31% {
          opacity: 0.35;
        }
        32% {
          opacity: 1;
        }
        33% {
          opacity: 0.15;
        }
        34% {
          opacity: 0.9;
        }
        35% {
          opacity: 0.3;
        }
        71% {
          opacity: 0.4;
        }
        72% {
          opacity: 1;
        }
        73% {
          opacity: 0.12;
        }
        74% {
          opacity: 1;
        }
      }

      /* flying bats */
      .fb {
        position: fixed;
        z-index: 3;
        pointer-events: none;
        width: var(--w, 90px);
        left: -160px;
        top: var(--y1, 30%);
        animation: batfly var(--d, 16s) linear var(--dl, 0s) infinite;
      }
      .fb.rl {
        left: auto;
        right: -160px;
        animation-name: batflyR;
      }
      .fb svg {
        width: 100%;
        display: block;
        fill: #07070a;
        filter: drop-shadow(0 0 5px rgba(224, 16, 30, 0.85))
          drop-shadow(0 0 14px rgba(224, 16, 30, 0.35));
        animation: glideb 1.3s ease-in-out infinite;
      }
      .fb .wl,
      .fb .wr {
        animation-duration: 0.22s;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
        animation-direction: alternate;
        transform-origin: 50px 28px;
      }
      .fb .wl {
        animation-name: flapL;
      }
      .fb .wr {
        animation-name: flapR;
      }
      @keyframes flapL {
        from {
          transform: rotate(-32deg) scaleY(1);
        }
        to {
          transform: rotate(22deg) scaleY(0.7);
        }
      }
      @keyframes flapR {
        from {
          transform: rotate(32deg) scaleY(1);
        }
        to {
          transform: rotate(-22deg) scaleY(0.7);
        }
      }
      @keyframes glideb {
        0%,
        100% {
          transform: translateY(-10px);
        }
        50% {
          transform: translateY(10px);
        }
      }
      .fb.b1 {
        --w: 96px;
        --d: 15s;
        --dl: 0s;
        --y1: 14%;
        --y2: 30%;
        --y3: 20%;
      }
      .fb.b2 {
        --w: 70px;
        --d: 19s;
        --dl: -6s;
        --y1: 60%;
        --y2: 44%;
        --y3: 70%;
      }
      .fb.b3 {
        --w: 54px;
        --d: 12s;
        --dl: -3s;
        --y1: 38%;
        --y2: 22%;
        --y3: 50%;
      }
      .fb.b4 {
        --w: 88px;
        --d: 17s;
        --dl: -10s;
        --y1: 25%;
        --y2: 48%;
        --y3: 12%;
      }
      .fb.b5 {
        --w: 46px;
        --d: 13s;
        --dl: -8s;
        --y1: 72%;
        --y2: 58%;
        --y3: 82%;
      }
      .fb.b6 {
        --w: 62px;
        --d: 21s;
        --dl: -14s;
        --y1: 10%;
        --y2: 34%;
        --y3: 18%;
      }
      .fb.b7 {
        --w: 78px;
        --d: 16s;
        --dl: -1s;
        --y1: 50%;
        --y2: 66%;
        --y3: 36%;
      }
      @keyframes batfly {
        0% {
          left: -160px;
          top: var(--y1);
        }
        15% {
          top: var(--y2);
        }
        30% {
          top: var(--y3);
        }
        45% {
          top: var(--y1);
        }
        60% {
          top: var(--y3);
        }
        75% {
          top: var(--y2);
        }
        90% {
          top: var(--y1);
        }
        100% {
          left: calc(100vw + 160px);
          top: var(--y2);
        }
      }
      @keyframes batflyR {
        0% {
          right: -160px;
          top: var(--y1);
        }
        15% {
          top: var(--y2);
        }
        30% {
          top: var(--y3);
        }
        45% {
          top: var(--y1);
        }
        60% {
          top: var(--y3);
        }
        75% {
          top: var(--y2);
        }
        90% {
          top: var(--y1);
        }
        100% {
          right: calc(100vw + 160px);
          top: var(--y2);
        }
      }
      @media (max-width: 820px) {
        .fb {
          width: calc(var(--w, 90px) * 0.7);
        }
        .fb.b5,
        .fb.b6 {
          display: none;
        }
      }

      /* smoke gets thicker and thinner like passing clouds */
      .fog {
        animation: fogbreath 17s ease-in-out infinite;
      }
      @keyframes fogbreath {
        0% {
          opacity: 0.22;
        }
        25% {
          opacity: 1;
        }
        42% {
          opacity: 1;
        }
        62% {
          opacity: 0.28;
        }
        80% {
          opacity: 0.95;
        }
        100% {
          opacity: 0.22;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fog span,
        .gear,
        .spark,
        .rocket,
        .rocket i,
        .cover::after,
        .lamp,
        .lamp .lit,
        .fb,
        .fb *,
        .fog,
        h1 span,
        h1 .u,
        .moon,
        .bat,
        .win {
          animation: none !important;
        }
      }
      .lead {
        margin-top: 34px;
        color: var(--text);
        line-height: 2;
        letter-spacing: 0.06em;
        font-size: 0.98rem;
        max-width: 430px;
      }
      .bar {
        width: 68px;
        height: 3px;
        background: var(--red);
        margin: 30px 0;
      }
      .feats {
        display: flex;
        max-width: 440px;
      }
      .feat {
        flex: 1;
        text-align: center;
        padding: 4px 14px;
        font-size: 0.66rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .feat + .feat {
        border-left: 1px solid rgba(255, 255, 255, 0.2);
      }
      .feat svg {
        width: 30px;
        height: 30px;
        stroke: var(--red);
        fill: none;
        stroke-width: 1.5;
        display: block;
        margin: 0 auto 12px;
      }
      hr {
        border: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        max-width: 436px;
        margin: 34px 0 28px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 22px;
        flex-wrap: wrap;
      }
      .social {
        display: flex;
        gap: 14px;
      }
      .social a {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition: 0.25s;
      }
      .social a:hover {
        background: var(--red);
        border-color: var(--red);
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(224, 16, 30, 0.4);
      }
      .social svg {
        width: 19px;
        height: 19px;
        fill: currentColor;
      }
      .btn {
        font: inherit;
        font-size: 0.78rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        background: var(--red);
        color: #fff;
        border: 0;
        padding: 14px 26px;
        cursor: pointer;
        transition: 0.25s;
      }
      .btn:hover {
        background: #ff2433;
        box-shadow: 0 0 24px rgba(224, 16, 30, 0.55);
      }
      footer {
        font-size: 0.72rem;
        color: #8a8a93;
        letter-spacing: 0.08em;
        padding-top: 10px;
      }
      footer a {
        color: inherit;
        text-decoration: none;
      }
      footer a:hover {
        color: #fff;
      }

      /* hanging lights that flicker as if a ghost is near */
      .lamp {
        position: fixed;
        top: 0;
        z-index: 4;
        pointer-events: none;
        transform-origin: 50% 0;
        width: 0;
        animation: swing 5s ease-in-out infinite alternate;
      }
      .lamp .cord {
        width: 2px;
        height: var(--h, 100px);
        background: linear-gradient(#000, #3a3a42);
        position: absolute;
        left: -1px;
        top: 0;
      }
      .lamp .head {
        position: absolute;
        top: var(--h, 100px);
        left: 0;
        transform: translateX(-50%);
      }
      .lamp .shade {
        width: 66px;
        height: 9px;
        background: linear-gradient(#2c2c32, #111114);
        border-radius: 3px;
        border-bottom: 2px solid #6b6b10;
        margin: 0 auto;
      }
      .lamp .lit {
        position: relative;
        animation: ghostblink 6s infinite;
      }
      .lamp .bulb {
        width: 58px;
        height: 9px;
        border-radius: 6px;
        margin: -1px auto 0;
        background: linear-gradient(
          90deg,
          #d8e63a,
          #fffde0 20%,
          #fffde0 80%,
          #d8e63a
        );
        box-shadow:
          0 0 12px 5px rgba(240, 255, 70, 0.8),
          0 0 50px 18px rgba(225, 240, 50, 0.4);
      }
      .lamp .cone {
        position: absolute;
        top: 10px;
        left: 50%;
        width: 260px;
        height: 360px;
        transform: translateX(-50%);
        background: linear-gradient(
          rgba(240, 250, 80, 0.26),
          rgba(220, 235, 50, 0.07) 60%,
          transparent
        );
        clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
        mix-blend-mode: screen;
      }
      .lamp.l1 {
        left: 38%;
        --h: 90px;
        animation-duration: 5.5s;
      }
      .lamp.l2 {
        left: 63%;
        --h: 170px;
        animation-duration: 4.6s;
        animation-delay: -2s;
      }
      .lamp.l2 .lit {
        animation-duration: 7.3s;
        animation-delay: -3s;
      }
      .lamp.l3 {
        left: 89%;
        --h: 60px;
        animation-duration: 6.2s;
        animation-delay: -4s;
      }
      .lamp.l3 .lit {
        animation-duration: 5.1s;
        animation-delay: -1.5s;
      }
      @keyframes swing {
        from {
          transform: rotate(-4deg);
        }
        to {
          transform: rotate(4deg);
        }
      }
      @keyframes ghostblink {
        0%,
        12%,
        20%,
        44%,
        50%,
        78%,
        89%,
        100% {
          opacity: 1;
        }
        13% {
          opacity: 0.1;
        }
        14% {
          opacity: 0.9;
        }
        15% {
          opacity: 0.05;
        }
        16% {
          opacity: 0.7;
        }
        17% {
          opacity: 0;
        }
        18% {
          opacity: 1;
        }
        45% {
          opacity: 0.2;
        }
        46% {
          opacity: 1;
        }
        47% {
          opacity: 0.08;
        }
        48% {
          opacity: 0.8;
        }
        49% {
          opacity: 0.1;
        }
        79% {
          opacity: 0.3;
        }
        80% {
          opacity: 1;
        }
        81% {
          opacity: 0;
        }
        82% {
          opacity: 0.6;
        }
        83% {
          opacity: 1;
        }
        90% {
          opacity: 0.04;
        }
        91% {
          opacity: 0.04;
        }
        92% {
          opacity: 0.9;
        }
        93% {
          opacity: 0.1;
        }
        94% {
          opacity: 1;
        }
      }
      @media (max-width: 820px) {
        .lamp.l1,
        .lamp.l2 {
          display: none;
        }
        .lamp.l3 {
          --h: 50px;
        }
        .lamp .cone {
          position: absolute;
          top: 10px;
          left: 50%;
          width: 260px;
          height: 360px;
          transform: translateX(-50%);
          background: linear-gradient(
            rgba(240, 250, 80, 0.26),
            rgba(220, 235, 50, 0.07) 60%,
            transparent
          );
          clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
          mix-blend-mode: screen;
        }
      }

      /* cover photo (the real artwork) */
      .cover {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        width: calc(100vh * 0.772);
        width: calc(100dvh * 0.772);

      }
      .cover::after {
        content: "";
        position: absolute;
        left: 4%;
        top: 8%;
        width: 52%;
        height: 34%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 40, 40, 0.35),
          transparent 70%
        );
        mix-blend-mode: screen;
        animation: moonpulse 5s ease-in-out infinite;
      }
      @keyframes moonpulse {
        50% {
          opacity: 0.25;
        }
      }
      @media (max-aspect-ratio: 7/8) {
        .cover {
          left: 0;
          width: auto;
          min-width: 0;
          background-size: cover;
          background-position: 30% 50%;
          -webkit-mask-image: none;
          mask-image: none;
        }
      }

      /* icons */
      .feat .gear {
        animation: spin 6s linear infinite;
        transform-origin: 50% 50%;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .rocket {
        display: block;
        position: relative;
        width: 30px;
        height: 30px;
        margin: 0 auto 12px;
        animation: shake 0.3s linear infinite;
      }
      .rocket svg {
        margin: 0 !important;
        position: relative;
        z-index: 1;
      }
      .rocket i {
        position: absolute;
        left: 3px;
        bottom: 3px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(205, 205, 215, 0.8);
        filter: blur(1.5px);
        opacity: 0;
        animation: puff 1.6s linear infinite;
      }
      .rocket i:nth-child(1) {
        background: rgba(255, 80, 60, 0.85);
      }
      .rocket i:nth-child(2) {
        animation-delay: 0.4s;
      }
      .rocket i:nth-child(3) {
        animation-delay: 0.8s;
      }
      .rocket i:nth-child(4) {
        animation-delay: 1.2s;
      }
      @keyframes puff {
        0% {
          opacity: 0.85;
          transform: translate(0, 0) scale(0.6);
        }
        100% {
          opacity: 0;
          transform: translate(-26px, 26px) scale(3.2);
        }
      }
      @keyframes shake {
        0%,
        100% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(0.6px, -0.6px);
        }
        75% {
          transform: translate(-0.6px, 0.6px);
        }
      }
      .feat .spark {
        animation: sparkBlink 1.8s infinite;
        transform-origin: 50% 50%;
      }
      @keyframes sparkBlink {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
          filter: drop-shadow(0 0 4px #e0101e);
        }
        40% {
          opacity: 0.08;
          transform: scale(0.7);
          filter: none;
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
          filter: drop-shadow(0 0 10px #ff2433);
        }
        60% {
          opacity: 0.15;
          transform: scale(0.8);
        }
        70% {
          opacity: 1;
          transform: scale(1.1);
        }
      }

      /* smoke drifting in from the sides */
      .fog {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }
      .fog span {
        position: absolute;
        width: 60vw;
        height: 48vh;
        border-radius: 50%;
        opacity: 0;
        filter: blur(34px);
        background: radial-gradient(
          ellipse at center,
          rgba(215, 215, 225, 0.3),
          rgba(215, 215, 225, 0.1) 45%,
          transparent 70%
        );
      }
      .fog .a {
        left: -40vw;
        top: 10%;
        animation: smokeL 18s ease-in-out infinite;
      }
      .fog .b {
        left: -45vw;
        top: 52%;
        animation: smokeL 23s ease-in-out -8s infinite;
      }
      .fog .c {
        left: -40vw;
        bottom: -12%;
        height: 36vh;
        animation: smokeL 20s ease-in-out -13s infinite;
        background: radial-gradient(
          ellipse at center,
          rgba(224, 16, 30, 0.22),
          transparent 70%
        );
      }
      .fog .d {
        right: -40vw;
        top: 25%;
        animation: smokeR 21s ease-in-out -4s infinite;
      }
      .fog .e {
        right: -45vw;
        top: 60%;
        animation: smokeR 26s ease-in-out -15s infinite;
      }
      .fog .f {
        right: -40vw;
        bottom: -10%;
        height: 34vh;
        animation: smokeR 19s ease-in-out -9s infinite;
      }
      .fog .g {
        left: -50vw;
        top: -6%;
        height: 42vh;
        animation: smokeL 15s ease-in-out -3s infinite;
      }
      .fog .h {
        left: -45vw;
        top: 34%;
        width: 70vw;
        animation: smokeL 17s ease-in-out -11s infinite;
      }
      .fog .i {
        left: -40vw;
        top: 72%;
        animation: smokeL 14s ease-in-out -6s infinite;
        background: radial-gradient(
          ellipse at center,
          rgba(224, 16, 30, 0.2),
          transparent 70%
        );
      }
      .fog .j {
        right: -50vw;
        top: -4%;
        height: 40vh;
        animation: smokeR 16s ease-in-out -7s infinite;
      }
      .fog .k {
        right: -45vw;
        top: 42%;
        width: 70vw;
        animation: smokeR 18s ease-in-out -12s infinite;
      }
      .fog .l {
        right: -40vw;
        top: 75%;
        animation: smokeR 14s ease-in-out -2s infinite;
        background: radial-gradient(
          ellipse at center,
          rgba(224, 16, 30, 0.2),
          transparent 70%
        );
      }
      .fog span {
        will-change: transform, opacity;
      }
      @keyframes smokeL {
        0% {
          transform: translateX(0) scale(1);
          opacity: 0;
        }
        25% {
          opacity: 0.95;
        }
        65% {
          transform: translateX(52vw) scale(1.3);
          opacity: 0.7;
        }
        100% {
          transform: translateX(75vw) scale(1.6);
          opacity: 0;
        }
      }
      @keyframes smokeR {
        0% {
          transform: translateX(0) scale(1);
          opacity: 0;
        }
        25% {
          opacity: 0.95;
        }
        65% {
          transform: translateX(-52vw) scale(1.3);
          opacity: 0.7;
        }
        100% {
          transform: translateX(-75vw) scale(1.6);
          opacity: 0;
        }
      }
      @media (max-width: 820px) {
        .fog span {
          width: 95vw;
        }
      }

      /* contact modal */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal.open {
        display: flex;
      }
      .card {
        width: 100%;
        max-width: 460px;
        background: #0e0e12;
        border: 1px solid rgba(224, 16, 30, 0.35);
        box-shadow: 0 0 60px rgba(224, 16, 30, 0.2);
        padding: 34px;
        position: relative;
      }
      .card h2 {
        font-family: "Playfair Display", serif;
        font-size: 1.8rem;
        margin-bottom: 6px;
      }
      .card h2 span {
        color: var(--red);
      }
      .card p.sub {
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 22px;
      }
      .close {
        position: absolute;
        top: 12px;
        right: 16px;
        background: none;
        border: 0;
        color: #fff;
        font-size: 1.8rem;
        cursor: pointer;
        line-height: 1;
      }
      label {
        display: block;
        font-size: 0.68rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      input,
      textarea {
        width: 100%;
        background: #15151b;
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #fff;
        font: inherit;
        padding: 12px 14px;
        outline: none;
        transition: 0.2s;
      }
      input:focus,
      textarea:focus {
        border-color: var(--red);
        box-shadow: 0 0 0 3px rgba(224, 16, 30, 0.2);
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      .hp {
        position: absolute;
        left: -9999px;
        opacity: 0;
      }
      .card .btn {
        width: 100%;
        margin-top: 22px;
      }
      .card .btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .status {
        margin-top: 14px;
        font-size: 0.85rem;
        min-height: 1.2em;
      }
      .status.ok {
        color: #4ade80;
      }
      .status.err {
        color: #ff6b6b;
      }

      @media (max-width: 820px) {
        .scene {
          width: 100%;
          opacity: 0.55;
        }
        .scene::after {
          background: linear-gradient(
            180deg,
            rgba(8, 8, 10, 0.4),
            var(--bg) 85%
          );
        }

    <div
      class="modal"
      id="modal"
      role="dialog"
      aria-modal="true"

    >
      <div class="card">
        <button class="close" id="closeContact" aria-label="Close">
          &times;
        </button>
        <h2 id="ct">Get in <span>Touch</span></h2>
        <p class="sub">
          Send me a message and it will land directly in my inbox.
        </p>
        <form id="form" novalidate>
          <label for="name">Your Name</label>
          <input
            id="name"
            name="name"
            type="text"
            required
            autocomplete="name"
            placeholder="John Doe"
          />
          <label for="email">Your Email</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
          />
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            required
            placeholder="How can I help you?"
          ></textarea>
          <input
            class="hp"
            type="text"
            name="_honey"
            tabindex="-1"
            autocomplete="off"
          />
          <button class="btn" id="send" type="submit">Send Message</button>
          <div class="status" id="status" role="status"></div>
        </form>
      </div>
    </div>

    <script>
      const modal = document.getElementById("modal"),
        form = document.getElementById("form"),
        statusEl = document.getElementById("status"),
        sendBtn = document.getElementById("send");
      const TO = "pandeyashish2056@gmail.com";

      const open = () => {
        modal.classList.add("open");
        setTimeout(() => document.getElementById("name").focus(), 50);
      };
      const close = () => modal.classList.remove("open");
      document.getElementById("openContact").onclick = open;
      document.getElementById("closeContact").onclick = close;
      modal.addEventListener("click", (e) => {
        if (e.target === modal) close();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") close();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const d = Object.fromEntries(new FormData(form));
        statusEl.className = "status";
        if (
          !d.name.trim() ||
          !/^\S+@\S+\.\S+$/.test(d.email) ||
          !d.message.trim()
        ) {
          statusEl.classList.add("err");
          statusEl.textContent =
            "Please fill in all fields with a valid email.";
          return;
        }
        sendBtn.disabled = true;
        sendBtn.textContent = "Sending...";
        try {
          const r = await fetch("https://formsubmit.co/ajax/" + TO, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify({
              name: d.name,
              email: d.email,
              message: d.message,
              _honey: d._honey,
              _subject: "New message from ashishpandey.com.np",
              _template: "table",
              _replyto: d.email,
            }),
          });
          const j = await r.json();
          if (r.ok && (j.success === true || j.success === "true")) {
            statusEl.classList.add("ok");
            statusEl.textContent = "Thank you! Your message has been sent.";
            form.reset();
          } else throw new Error(j.message || "failed");
        } catch (err) {
          statusEl.classList.add("err");
          statusEl.innerHTML =
            'Could not send right now. Please email me at <a style="color:#fff" href="mailto:' +
            TO +
            '">' +
            TO +
            "</a>.";
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = "Send Message";
        }
      });
    </script>
  </body>
</html>
