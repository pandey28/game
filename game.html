<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maintenance Mode – Play Pac-Man</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(circle at 50% 0,#1d2266 0,#070918 65%) fixed;color:#fff;font-family:'Press Start 2P',monospace;display:flex;flex-direction:column;align-items:center;padding:14px 12px 28px;user-select:none;-webkit-user-select:none}
header{text-align:center;max-width:520px}
h1{font-size:clamp(13px,4vw,24px);line-height:1.5;color:#ff3b4e;text-shadow:0 0 14px #ff3b4e99;margin:6px 0 8px}
header p{font:clamp(12px,3vw,15px)/1.5 system-ui,sans-serif;color:#b9c0ff;margin:0 0 12px}
.game{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.hud,.board{width:min(100%,440px,calc((100vh - 360px)*.8636));min-width:260px}
.hud{display:flex;justify-content:space-between;font-size:clamp(7px,2vw,9px);color:#8e97ff;text-align:center}
.hud b{display:block;margin-top:6px;font-weight:400;color:#ffe600;font-size:clamp(10px,3vw,13px)}
.board{border-radius:16px;padding:6px;background:#060822;box-shadow:0 0 0 2px #2a3cff,0 0 30px #2a3cff66,inset 0 0 30px #000}
canvas{display:block;width:100%;aspect-ratio:380/440;border-radius:10px;touch-action:none;background:#000}
.bar{display:flex;gap:10px}
button{font:inherit;color:#fff;cursor:pointer;border:0}
.bar button{height:46px;min-width:46px;padding:0 16px;font-size:11px;border-radius:23px;background:linear-gradient(#3b4dff,#1f2bb8);box-shadow:0 4px 0 #11186e,0 0 16px #3b4dff55;transition:transform .08s}
.bar button:active{transform:translateY(3px);box-shadow:0 1px 0 #11186e}
#play{background:linear-gradient(#ffe600,#ffb300);color:#241a00;box-shadow:0 4px 0 #9a6b00,0 0 16px #ffd00055;min-width:130px}
#snd.off{background:linear-gradient(#ff4d5f,#b81c2c);box-shadow:0 4px 0 #6e1019}
.dpad{display:none;grid:repeat(3,64px)/repeat(3,64px);gap:6px;margin-top:4px;touch-action:none}
.dpad button{border-radius:18px;font-size:22px;background:linear-gradient(#1c2380,#10154f);box-shadow:0 0 0 2px #3b4dff,0 4px 0 #080b33;touch-action:none}
.dpad button:active{background:#3b4dff}
.dpad [data-d=U]{grid-area:1/2}.dpad [data-d=L]{grid-area:2/1}.dpad [data-d=R]{grid-area:2/3}.dpad [data-d=D]{grid-area:3/2}
.hint{font:12px/1.6 system-ui,sans-serif;color:#7d86d8;text-align:center;margin:2px 0 0}
footer{margin-top:22px;font:12px/1.6 system-ui,sans-serif;color:#7d86d8;text-align:center}
footer a{color:#ffe600;text-decoration:none;border-bottom:1px dotted #ffe60088}
footer a:hover{color:#fff;border-color:#fff}
@media (pointer:coarse),(max-width:720px){.dpad{display:grid}}
</style>
</head>
<body>
<header>
  <h1>🚧 Site Under Maintenance</h1>
  <p>We’ll be back soon! In the meantime, enjoy the game.</p>
</header>
<main class="game">
  <div class="hud">
    <div>SCORE<b id="sc">0</b></div><div>BEST<b id="hi">0</b></div>
    <div>LEVEL<b id="lv">1</b></div><div>LIVES<b id="li">♥♥♥</b></div>
  </div>
  <div class="board"><canvas id="c"></canvas></div>
  <div class="bar">
    <button id="play">▶ START</button>
    <button id="restart" aria-label="Restart">↻</button>
    <button id="snd" aria-label="Sound on/off">🔊</button>
  </div>
  <div class="dpad">
    <button data-d="U" aria-label="Up">▲</button><button data-d="L" aria-label="Left">◀</button>
    <button data-d="R" aria-label="Right">▶</button><button data-d="D" aria-label="Down">▼</button>
  </div>
  <p class="hint">Arrow keys / WASD to move · P or Space to pause · M for sound · or swipe on the board</p>
</main>
<footer>© 2026 <a href="https://www.ashishpandey.com.np" target="_blank" rel="noopener">Aashish Pandey</a>. All rights reserved.</footer>

<script>
(()=>{
'use strict';
const W=19,H=22,S=20,CW=W*S,CH=H*S,F="'Press Start 2P',monospace";
const ROWS=[
"###################","#........#........#","#o##.###.#.###.##o#","#.##.###.#.###.##.#",
"#.................#","#.##.#.#####.#.##.#","#....#...#...#....#","####.###.#.###.####",
"   #.#.......#.#   ","####.#.##-##.#.####","    ...#---#...    ","####.#.#####.#.####",
"   #.#... ...#.#   ","####.#.#####.#.####","#........#........#","#.##.###.#.###.##.#",
"#o.#...........#.o#","##.#.#.#####.#.#.##","#....#...#...#....#","#.######.#.######.#",
"#.................#","###################"];
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]],[R,L,D,U]=DIRS;
const KMAP={ArrowRight:R,d:R,D:R,ArrowLeft:L,a:L,A:L,ArrowDown:D,s:D,S:D,ArrowUp:U,w:U,W:U};
const GCOL=['#ff3030','#ffb8de','#00ffde','#ffb847'],GX=[60,80,100,120],GR=[.2,.3,.45,.35];
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
let map,dots,pac,ghosts,state='idle',paused=false,tick=0,timer=0,score=0,hi=0,lives=3,level=1,k=1,combo=0,powerUntil=0,nextLife=10000,muted=false;
try{hi=+localStorage.getItem('pm_hi')||0;muted=localStorage.getItem('pm_mute')==='1'}catch(e){}

/* ---------- sound (synthesised, no files needed) ---------- */
let ac;
function tone(f,d,type,v,t,f2){
  if(muted)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(t||0);
    o.type=type||'square';o.frequency.setValueAtTime(f,s);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);
    g.gain.setValueAtTime(v||.05,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
    o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d);
  }catch(e){}
}
const SFX={
  chomp:()=>tone(tick%2?220:330,.07,'square',.04),
  pill:()=>tone(150,.35,'sawtooth',.06,0,600),
  ghost:()=>tone(300,.25,'square',.06,0,1200),
  die:()=>tone(600,.9,'sawtooth',.07,0,50),
  start:()=>[262,330,392,523].forEach((f,i)=>tone(f,.15,'square',.05,i*.13)),
  win:()=>[392,494,587,784].forEach((f,i)=>tone(f,.15,'square',.05,i*.1))
};

/* ---------- game setup ---------- */
function buildMap(){map=ROWS.map(r=>[...r]);dots=map.flat().filter(c=>c==='.'||c==='o').length}
function resetPos(){
  pac={x:90,y:120,d:L,w:L,mv:false};
  ghosts=GCOL.map((c,i)=>({c,i,x:GX[i],y:80,sx:GX[i],d:i%2?R:L,fr:false,dead:0}));
  powerUntil=0;combo=0;
}
function start(){
  score=0;lives=3;level=1;nextLife=10000;paused=false;
  buildMap();resetPos();state='ready';timer=75;SFX.start();ui();
}
function passable(x,y){
  if(y===10&&(x<0||x>=W))return true;
  if(x<0||y<0||x>=W||y>=H)return false;
  const c=map[y][x];return c!=='#'&&c!=='-';
}
const wrap=e=>{if(e.x<-10)e.x=190;else if(e.x>190)e.x=-10};
const grid=e=>e.x%10===0&&e.y%10===0;

/* ---------- movement ---------- */
function movePac(){
  const g=grid(pac),tx=pac.x/10,ty=pac.y/10;
  if(g){
    if(passable(tx+pac.w[0],ty+pac.w[1]))pac.d=pac.w;
    if(!passable(tx+pac.d[0],ty+pac.d[1])){pac.mv=false;return}
  }else if(pac.w[0]===-pac.d[0]&&pac.w[1]===-pac.d[1])pac.d=pac.w;
  pac.mv=true;pac.x+=pac.d[0]*2;pac.y+=pac.d[1]*2;wrap(pac);
  if(grid(pac)){
    const x=pac.x/10,y=pac.y/10,c=map[y]&&map[y][x];
    if(c==='.'||c==='o'){
      map[y][x]=' ';dots--;
      if(c==='.'){score+=10;SFX.chomp()}
      else{
        score+=50;combo=0;powerUntil=tick+Math.max(3,8-level)*30;SFX.pill();
        ghosts.forEach(q=>{if(!q.dead){q.fr=true;q.d=[-q.d[0],-q.d[1]]}});
      }
    }
  }
}
function moveGhost(g){
  if(g.dead){g.dead--;return}
  if(g.fr&&tick%2)return; /* frightened ghosts are slower */
  if(grid(g)){
    const gx=g.x/10,gy=g.y/10;
    let o=DIRS.filter(d=>passable(gx+d[0],gy+d[1])&&!(d[0]===-g.d[0]&&d[1]===-g.d[1]));
    if(!o.length)o=DIRS.filter(d=>passable(gx+d[0],gy+d[1]));
    const px=pac.x/10+(g.i===1?pac.d[0]*4:0),py=pac.y/10+(g.i===1?pac.d[1]*4:0);
    const dist=d=>(gx+d[0]-px)**2+(gy+d[1]-py)**2;
    g.d=(g.fr||Math.random()<Math.max(.05,GR[g.i]-.02*level))
      ?o[Math.random()*o.length|0]:o.reduce((a,b)=>dist(b)<dist(a)?b:a);
  }
  g.x+=g.d[0]*2;g.y+=g.d[1]*2;wrap(g);
}

function update(){
  tick++;
  if(state==='ready'){if(--timer<=0)state='play';return}
  if(state==='dying'){
    if(--timer<=0){
      if(--lives<=0){state='over';if(score>hi){hi=score;try{localStorage.setItem('pm_hi',hi)}catch(e){}}ui()}
      else{resetPos();state='ready';timer=45}
    }
    return;
  }
  if(state!=='play')return;
  movePac();
  if(tick>=powerUntil)ghosts.forEach(g=>g.fr=false);
  ghosts.forEach(moveGhost);
  for(const g of ghosts){
    if(g.dead||Math.hypot(g.x-pac.x,g.y-pac.y)>=10)continue;
    if(g.fr){
      g.fr=false;score+=200*2**Math.min(combo++,3);g.x=g.sx;g.y=80;g.dead=90;SFX.ghost();
    }else{state='dying';timer=60;SFX.die();break}
  }
  if(score>=nextLife){lives++;nextLife+=10000}
  if(dots<=0){level++;buildMap();resetPos();state='ready';timer=75;SFX.win()}
  if(score>hi)hi=score;
}

/* ---------- drawing ---------- */
function drawWalls(){
  ctx.fillStyle='rgba(40,70,255,.16)';ctx.strokeStyle='#4a66ff';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.shadowColor='#4a66ff';ctx.shadowBlur=7;ctx.beginPath();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(map[y][x]!=='#')continue;
    ctx.fillRect(x*S,y*S,S,S);
    for(const d of DIRS){
      const nx=x+d[0],ny=y+d[1];
      if(nx<0||ny<0||nx>=W||ny>=H||map[ny][nx]==='#')continue;
      const sx=x+(d[0]>0),sy=y+(d[1]>0),ex=d[0]?sx:sx+1,ey=d[1]?sy:sy+1;
      ctx.moveTo(sx*S,sy*S);ctx.lineTo(ex*S,ey*S);
    }
  }
  ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle='#ff9ad5';ctx.fillRect(8.6*S,9.8*S,1.8*S,3); /* ghost house door */
}
function drawItems(){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=map[y][x];
    if(c==='.'){ctx.fillStyle='#ffe9b0';ctx.beginPath();ctx.arc(x*S+S/2,y*S+S/2,2,0,7);ctx.fill()}
    else if(c==='o'){
      ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=8;ctx.beginPath();
      ctx.arc(x*S+S/2,y*S+S/2,4.5+Math.sin(tick*.3)*1.5,0,7);ctx.fill();ctx.shadowBlur=0;
    }
  }
}
function drawGhost(g){
  const x=g.x/10*S,y=g.y/10*S,r=S/2,rem=(powerUntil-tick)/30;
  const col=g.dead?null:g.fr?(rem<2&&tick%10>5?'#fff':'#2233ff'):g.c;
  if(col){
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=9;ctx.beginPath();
    ctx.arc(x+r,y+r,r-1,Math.PI,0);ctx.lineTo(x+S-1,y+S-1);
    for(let i=1;i<=6;i++)ctx.lineTo(x+S-1-i*(S-2)/6,y+S-1-(i%2?3:0));
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  }
  ctx.fillStyle=g.fr?'#ffd':'#fff';
  for(const ex of[6,14]){ctx.beginPath();ctx.arc(x+ex,y+8,g.fr?1.8:3.2,0,7);ctx.fill()}
  if(!g.fr){
    ctx.fillStyle='#12156b';
    for(const ex of[6,14]){ctx.beginPath();ctx.arc(x+ex+g.d[0]*1.5,y+8+g.d[1]*1.5,1.6,0,7);ctx.fill()}
  }
}
function drawPac(){
  const cx=pac.x/10*S+S/2,cy=pac.y/10*S+S/2,a=Math.atan2(pac.d[1],pac.d[0]);
  let m=pac.mv||state==='ready'?Math.abs(Math.sin(tick*.5))*.28*Math.PI:.2;
  if(state==='dying')m=(1-timer/60)*Math.PI;
  if(state==='dying'&&m>=Math.PI)return;
  ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';ctx.shadowBlur=10;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,S/2-1,a+m,a+Math.PI*2-m);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
}
function banner(t,s,col){
  ctx.fillStyle='rgba(5,6,20,.78)';ctx.fillRect(0,CH/2-48,CW,96);
  ctx.textAlign='center';ctx.fillStyle=col||'#ffe600';ctx.font='18px '+F;ctx.fillText(t,CW/2,CH/2-4);
  ctx.fillStyle='#fff';ctx.font='7px '+F;ctx.fillText(s,CW/2,CH/2+24);
}
function render(){
  ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,CW,CH);
  drawWalls();drawItems();
  if(state!=='dying')ghosts.forEach(drawGhost);
  drawPac();
  if(paused)banner('PAUSED','PRESS P, SPACE OR TAP TO RESUME');
  else if(state==='idle')banner('PAC-MAN','PRESS START - ARROWS / WASD / SWIPE');
  else if(state==='over')banner('GAME OVER','SCORE '+score+' - PRESS START TO RETRY','#ff3b4e');
  else if(state==='ready'){ctx.fillStyle='#ffe600';ctx.textAlign='center';ctx.font='12px '+F;ctx.fillText('READY!',CW/2,12.75*S)}
  $('sc').textContent=score;$('hi').textContent=hi;$('lv').textContent=level;$('li').textContent='♥'.repeat(Math.max(lives,0))||'-';
}
function fit(){
  const w=cv.getBoundingClientRect().width,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr*CH/CW);k=cv.width/CW;
}

/* ---------- controls ---------- */
function ui(){
  $('play').textContent=state==='idle'?'▶ START':state==='over'?'↻ AGAIN':paused?'▶ RESUME':'⏸ PAUSE';
  $('snd').textContent=muted?'🔇':'🔊';$('snd').classList.toggle('off',muted);
}
function togglePause(){
  if(state==='idle'||state==='over')return start();
  paused=!paused;ui();
}
function setDir(d){
  if(state==='idle'||state==='over')start();
  if(paused){paused=false;ui()}
  pac.w=d;
}
function toggleMute(){
  muted=!muted;try{localStorage.setItem('pm_mute',muted?'1':'0')}catch(e){}
  ui();if(!muted)tone(660,.1,'square',.05);
}
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const d=KMAP[e.key];
  if(d){e.preventDefault();setDir(d)}
  else if(e.key==='p'||e.key==='P'||e.key===' '||e.key==='Escape'){e.preventDefault();togglePause()}
  else if(e.key==='m'||e.key==='M')toggleMute();
  else if(e.key==='Enter'||e.key==='n'||e.key==='N'){e.preventDefault();start()}
});
addEventListener('keyup',e=>{if(e.key===' ')e.preventDefault()});
$('play').onclick=e=>{togglePause();e.currentTarget.blur()};
$('restart').onclick=e=>{start();e.currentTarget.blur()};
$('snd').onclick=e=>{toggleMute();e.currentTarget.blur()};
document.querySelectorAll('.dpad button').forEach(b=>b.addEventListener('pointerdown',e=>{
  e.preventDefault();setDir({R,L,D,U}[b.dataset.d]);
}));
let sx=null,sy=0,moved=false;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moved=false});
cv.addEventListener('pointermove',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.hypot(dx,dy)>22){moved=true;setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?R:L):(dy>0?D:U));sx=e.clientX;sy=e.clientY}
});
cv.addEventListener('pointerup',()=>{if(!moved&&(state==='idle'||state==='over'||paused))togglePause();sx=null});
cv.addEventListener('pointercancel',()=>{sx=null});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&state!=='idle'&&state!=='over'){paused=true;ui()}
});
addEventListener('resize',fit);

/* ---------- main loop (fixed 30 FPS logic, smooth rendering) ---------- */
let last=0,acc=0;
function loop(t){
  acc+=Math.min(t-last,100);last=t;
  while(acc>=1000/30){acc-=1000/30;if(!paused)update()}
  render();requestAnimationFrame(loop);
}
buildMap();resetPos();fit();ui();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
